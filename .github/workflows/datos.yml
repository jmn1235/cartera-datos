name: Precios de mercado
on:
  schedule:
    # Hora de Buenos Aires = UTC-3. Días hábiles: 12:10, 15:10 y 18:10 (cierre BYMA 17:00).
    - cron: "10 15 * * 1-5"
    - cron: "10 18 * * 1-5"
    - cron: "10 21 * * 1-5"
  workflow_dispatch: {}
  push:
    paths: ["tickers.json", "scripts/fetch.py", ".github/workflows/datos.yml"]
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  bajar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar precios
        run: python scripts/fetch.py
      - name: Guardar cambios
        run: |
          git config user.name "cartera-datos[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "Precios $(TZ=America/Argentina/Buenos_Aires date +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash || true
          git push
